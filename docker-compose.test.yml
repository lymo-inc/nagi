# Postgres 16 with the pgmq extension, shared by the `@nagi-js/postgres` and
# `@nagi-js/pgmq` integration suites. Store tests use unique per-test schemas
# (`nagi_test_<uuid7>`) and queue tests unique per-test queues, so a single
# container instance handles both suites. Keep the image in sync with the CI
# integration service.
#
# Usage:
#   pnpm db:up      # start
#   pnpm test:integration
#   pnpm db:down    # stop
services:
  postgres:
    image: ghcr.io/pgmq/pg16-pgmq:v1.13.0
    container_name: nagi-test-postgres
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: nagi_test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nagi_test"]
      interval: 1s
      timeout: 3s
      retries: 30
    tmpfs:
      # The image runs as the postgres user (uid 999); initdb cannot chmod a
      # root-owned tmpfs.
      - /var/lib/postgresql/data:uid=999,gid=999
